<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Enquiry Dashboard | RS Systems &amp; Solutions</title>
<link rel="icon" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0b1f3a; --blue:#0b4f8a; --sky:#0284c7; --bg:#f3f6fb; --line:#e2e8f0; --muted:#64748b; --green:#16a34a; --amber:#d97706; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); font-family:'Open Sans',system-ui,sans-serif; color:#1f2937; }
  header { position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; display:flex; align-items:center; gap:14px; padding:12px 22px; }
  header img { width:36px; height:36px; border-radius:8px; background:#fff; object-fit:contain; }
  header b { font-family:Montserrat,sans-serif; font-weight:800; display:block; line-height:1.1; }
  header small { color:#9db4d3; font-size:.72rem; }
  header .sp { flex:1; } header .who { font-size:.8rem; color:#cbd9ee; }
  .btn { border:1px solid var(--line); background:#fff; color:#0f172a; padding:9px 15px; border-radius:999px; font:600 .82rem 'Open Sans',sans-serif; cursor:pointer; }
  .btn:hover { border-color:var(--sky); color:var(--sky); } .btn.pri { background:var(--blue); color:#fff; border-color:var(--blue); } .btn.pri:hover { background:#083c6b; color:#fff; }
  header .btn { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); } header .btn:hover { background:rgba(255,255,255,.12); color:#fff; }
  main { max-width:1280px; margin:0 auto; padding:22px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:20px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .stat span { font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .stat b { display:block; font:800 1.9rem Montserrat,sans-serif; color:var(--navy); margin-top:4px; }
  .stat.new b { color:var(--sky); }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:999px; font:600 .8rem 'Open Sans',sans-serif; cursor:pointer; color:#334155; }
  .tab.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .bar input[type=search], .bar select { padding:9px 13px; border:1px solid var(--line); border-radius:999px; font:inherit; font-size:.85rem; background:#fff; }
  .bar input[type=search] { min-width:230px; } .bar .sp { flex:1; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:.86rem; }
  th { text-align:left; font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); background:#f8fafc; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:13px 14px; border-bottom:1px solid #eef2f7; vertical-align:top; }
  tr:last-child td { border-bottom:0; } tr.isnew td:first-child { box-shadow:inset 3px 0 0 var(--sky); }
  tbody tr:hover { background:#f8fbff; }
  .nm { font-weight:700; color:var(--navy); } .sub { color:var(--muted); font-size:.78rem; }
  .msgcell { max-width:300px; color:#475569; } .clip { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  td a { color:var(--sky); text-decoration:none; font-weight:600; } td a:hover { text-decoration:underline; }
  select.st { padding:6px 10px; border-radius:999px; border:1px solid var(--line); font:700 .76rem 'Open Sans',sans-serif; cursor:pointer; }
  select.st.New { background:#e0f2fe; color:#0369a1; border-color:#bae6fd; } select.st.Contacted { background:#fef3c7; color:#b45309; border-color:#fde68a; } select.st.Closed { background:#dcfce7; color:#15803d; border-color:#bbf7d0; }
  .acts { white-space:nowrap; } .ib { border:0; background:#f1f5f9; border-radius:8px; padding:7px 10px; cursor:pointer; font-size:.76rem; font-weight:600; color:#334155; margin-right:4px; } .ib:hover { background:#e2e8f0; } .ib.del:hover { background:#fee2e2; color:#b91c1c; }
  .empty { padding:46px 20px; text-align:center; color:var(--muted); }
  .note { margin:14px 2px 0; font-size:.78rem; color:var(--muted); }
  .overlay { position:fixed; inset:0; background:rgba(8,18,38,.6); display:none; place-items:center; padding:16px; z-index:50; } .overlay.on { display:grid; }
  .dlg { background:#fff; border-radius:20px; width:100%; max-width:520px; max-height:90vh; overflow:auto; padding:26px; }
  .dlg h3 { font-family:Montserrat,sans-serif; margin:0 0 14px; color:var(--navy); }
  .dlg dl { margin:0; display:grid; grid-template-columns:110px 1fr; gap:10px 12px; font-size:.88rem; } .dlg dt { color:var(--muted); font-weight:600; } .dlg dd { margin:0; word-break:break-word; white-space:pre-wrap; }
  .dlg .row { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; flex-wrap:wrap; }
  .gate { display:grid; place-items:center; min-height:60vh; text-align:center; color:var(--muted); }
  @media (max-width:860px) {
    thead { display:none; } table, tbody, tr, td { display:block; width:100%; }
    tr { padding:12px 14px; border-bottom:1px solid var(--line); } td { border:0; padding:3px 0; } .msgcell { max-width:none; }
    td[data-l]::before { content:attr(data-l) ': '; color:var(--muted); font-size:.72rem; font-weight:700; text-transform:uppercase; }
    main { padding:14px; } header .who { display:none; }
  }
</style>
</head>
<body>
<header>
  <img src="../assets/rslogo.jpeg" alt="">
  <span><b>RS Systems</b><small>Enquiry dashboard</small></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button class="btn" id="out" type="button">Sign out</button>
</header>

<main id="app" hidden>
  <section class="stats">
    <div class="stat"><span>Total enquiries</span><b id="s-all">0</b></div>
    <div class="stat new"><span>New</span><b id="s-new">0</b></div>
    <div class="stat"><span>Today</span><b id="s-today">0</b></div>
    <div class="stat"><span>Contacted</span><b id="s-con">0</b></div>
    <div class="stat"><span>Closed</span><b id="s-clo">0</b></div>
  </section>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-s="all">All</button><button class="tab" data-s="New">New</button>
      <button class="tab" data-s="Contacted">Contacted</button><button class="tab" data-s="Closed">Closed</button>
    </div>
    <span class="sp"></span>
    <select id="rq" aria-label="Filter by button / request"><option value="">All buttons</option></select>
    <input id="q" type="search" placeholder="Search name, phone, product...">
    <button class="btn pri" id="csv" type="button">Export CSV</button>
  </div>

  <div class="panel">
    <table>
      <thead><tr><th>Received</th><th>Contact</th><th>Request</th><th>Requirement</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No enquiries match.</div>
  </div>
  <p class="note">Updates appear live. "Request" is the name of the website button the visitor clicked.</p>
</main>
<div class="gate" id="gate"><p id="gatemsg">Checking sign-in...</p></div>

<div class="overlay" id="ov"><div class="dlg" id="dlg"></div></div>

<script type="module">
  import { firebaseConfig } from '../assets/firebase-config.js';
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, query, orderBy, onSnapshot, updateDoc, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const $ = id => document.getElementById(id);
  const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  if (/YOUR_/.test(firebaseConfig.apiKey)) { $('gatemsg').textContent = 'Firebase is not configured. Paste your config into assets/firebase-config.js.'; throw 0; }

  const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
  let all = [], status = 'all', unsub = null;
  const ts = d => d.createdAt && d.createdAt.toDate ? d.createdAt.toDate() : null;
  const fmt = d => d ? d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : 'just now';

  $('out').onclick = () => signOut(auth).then(() => location.replace('login.html'));

  onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) return location.replace('login.html');
    $('who').textContent = user.email;
    unsub = onSnapshot(query(collection(db, 'enquiries'), orderBy('createdAt', 'desc')), snap => {
      all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      $('gate').hidden = true; $('app').hidden = false; draw();
    }, err => {
      $('app').hidden = true; $('gate').hidden = false;
      $('gatemsg').innerHTML = err.code === 'permission-denied'
        ? 'This account is not authorised to view enquiries.<br>Add its email to <b>isAdmin()</b> in firestore.rules.'
        : 'Could not load enquiries (' + E(err.code) + ').';
    });
  });

  function filtered() {
    const q = $('q').value.trim().toLowerCase(), rq = $('rq').value;
    return all.filter(r => (status === 'all' || r.status === status) && (!rq || r.request === rq) &&
      (!q || [r.name, r.phone, r.email, r.company, r.product, r.message, r.request].join(' ').toLowerCase().includes(q)));
  }
  function draw() {
    const today = new Date().toDateString();
    $('s-all').textContent = all.length;
    $('s-new').textContent = all.filter(r => r.status === 'New').length;
    $('s-con').textContent = all.filter(r => r.status === 'Contacted').length;
    $('s-clo').textContent = all.filter(r => r.status === 'Closed').length;
    $('s-today').textContent = all.filter(r => { const d = ts(r); return d && d.toDateString() === today; }).length;
    const cur = $('rq').value, reqs = [...new Set(all.map(r => r.request).filter(Boolean))].sort();
    $('rq').innerHTML = '<option value="">All buttons</option>' + reqs.map(x => `<option${x === cur ? ' selected' : ''}>${E(x)}</option>`).join('');
    const rows = filtered();
    $('empty').hidden = rows.length > 0;
    $('rows').innerHTML = rows.map(r => `
      <tr class="${r.status === 'New' ? 'isnew' : ''}">
        <td data-l="Received">${E(fmt(ts(r)))}<div class="sub">${E(r.page || '')}</div></td>
        <td data-l="Contact"><div class="nm">${E(r.name)}</div><a href="tel:${E(r.phone)}">${E(r.phone)}</a>${r.email ? `<div><a href="mailto:${E(r.email)}">${E(r.email)}</a></div>` : ''}${r.company ? `<div class="sub">${E(r.company)}</div>` : ''}</td>
        <td data-l="Request"><div class="nm">${E(r.request)}</div><div class="sub">${E(r.product)}</div></td>
        <td data-l="Requirement" class="msgcell"><div class="clip">${E(r.message) || '<span class="sub">-</span>'}</div></td>
        <td data-l="Status"><select class="st ${E(r.status)}" data-id="${E(r.id)}"><option${r.status === 'New' ? ' selected' : ''}>New</option><option${r.status === 'Contacted' ? ' selected' : ''}>Contacted</option><option${r.status === 'Closed' ? ' selected' : ''}>Closed</option></select></td>
        <td class="acts"><button class="ib" data-v="${E(r.id)}">View</button><a class="ib" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${E(String(r.phone).replace(/\D/g, '').replace(/^(\d{10})$/, '91$1'))}">WhatsApp</a><button class="ib del" data-d="${E(r.id)}">Delete</button></td>
      </tr>`).join('');
  }

  $('tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return; status = b.dataset.s; [...$('tabs').children].forEach(t => t.classList.toggle('on', t === b)); draw(); };
  $('q').oninput = draw; $('rq').onchange = draw;

  $('rows').addEventListener('change', e => { const s = e.target.closest('select.st'); if (s) updateDoc(doc(db, 'enquiries', s.dataset.id), { status: s.value }).catch(() => alert('Could not update status.')); });
  $('rows').addEventListener('click', e => {
    const v = e.target.closest('[data-v]'), d = e.target.closest('[data-d]');
    if (v) { const r = all.find(x => x.id === v.dataset.v); if (r) detail(r); }
    if (d && confirm('Delete this enquiry permanently?')) deleteDoc(doc(db, 'enquiries', d.dataset.d)).catch(() => alert('Could not delete.'));
  });
  function detail(r) {
    $('dlg').innerHTML = `<h3>${E(r.request)}</h3><dl>
      <dt>Received</dt><dd>${E(fmt(ts(r)))}</dd><dt>Name</dt><dd>${E(r.name)}</dd><dt>Phone</dt><dd><a href="tel:${E(r.phone)}">${E(r.phone)}</a></dd>
      <dt>Email</dt><dd>${E(r.email) || '-'}</dd><dt>Company / City</dt><dd>${E(r.company) || '-'}</dd><dt>Product</dt><dd>${E(r.product)}</dd>
      <dt>Requirement</dt><dd>${E(r.message) || '-'}</dd><dt>Page</dt><dd>${E(r.page)}</dd><dt>Status</dt><dd>${E(r.status)}</dd></dl>
      <div class="row"><button class="btn" id="cl">Close</button></div>`;
    $('ov').classList.add('on'); $('cl').onclick = () => $('ov').classList.remove('on');
  }
  $('ov').onclick = e => { if (e.target === $('ov')) $('ov').classList.remove('on'); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('ov').classList.remove('on'); });

  $('csv').onclick = () => {
    const rows = filtered(), cols = ['Received', 'Name', 'Phone', 'Email', 'Company', 'Request', 'Product', 'Requirement', 'Status', 'Page'];
    const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };  // also blocks spreadsheet formula injection
    const csv = [cols.join(',')].concat(rows.map(r => [fmt(ts(r)), r.name, r.phone, r.email, r.company, r.request, r.product, r.message, r.status, r.page].map(cell).join(','))).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'rs-enquiries-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  };
</script>
</body>
</html>
